<button
  data-modal-target="edit-modal"
  data-modal-toggle="edit-modal"
  class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300"
  title="Edit"
>
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
    />
  </svg>
</button>
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
>
  <div class="relative w-full max-w-2xl max-h-full p-4">
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
      <div
        class="flex items-center justify-between p-4 border-b rounded-t dark:border-gray-600"
      >
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
          {{ userToEdit ? "Edit User" : "Add User" }}
        </h3>
        <button
          (click)="onCloseModal()"
          type="button"
          class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
        >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <div class="p-4 md:p-5">
        <form
          class="grid grid-cols-2 gap-4"
          [formGroup]="riderForm"
          (ngSubmit)="onSubmit($event)"
        >
          <div class="col-span-2 sm:col-span-1">
            <label
              for="username"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Username</label
            >
            <input
              formControlName="username"
              type="text"
              id="username"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"
              placeholder="Enter username"
            />
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label
              for="phoneNumber"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Phone Number</label
            >
            <input
              formControlName="phoneNumber"
              type="text"
              id="phoneNumber"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"
              placeholder="Enter phone number"
            />
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label
              for="department"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Department</label
            >
            <select
              formControlName="department"
              id="department"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"
            >
              <option *ngFor="let dept of departmentOptions" [value]="dept">
                {{ dept }}
              </option>
            </select>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label
              for="roles"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
              >Roles</label
            >
            <select
              formControlName="roles"
              id="roles"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"
            >
              <option *ngFor="let role of rolesOptions" [value]="role.id">
                {{ role.name }}
              </option>
            </select>
          </div>
          <div class="flex items-center col-span-2">
            <input
              formControlName="otpEnabled"
              id="otpEnabled"
              type="checkbox"
              class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600"
            />
            <label
              for="otpEnabled"
              class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300"
              >Enable OTP</label
            >
          </div>
          <div class="col-span-2">
            <button
              type="submit"
              class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
            >
              {{ userToEdit ? "Update User" : "Add User" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
