<div class="p-6">
  <div class="bg-purple-300 dark:bg-gray-800 p-6 rounded-lg shadow-sm mb-6">
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4"
    >
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
          Riders Management
        </h1>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
          Manage and monitor all riders
        </p>
      </div>

      <div class="flex items-center gap-3">
        <app-add-riders (riderAdded)="onRiderAdded()"></app-add-riders>
      </div>
    </div>
  </div>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
      <thead
        class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
      >
        <tr>
          <th
            *ngFor="let header of ['Name', 'Description', 'Status']"
            scope="col"
            class="px-6 py-3"
          >
            {{ header }}
          </th>
          <th scope="col" class="px-6 py-3">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let rider of riders"
          class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600"
        >
          <td
            class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
          >
            {{ rider.name }}
          </td>
          <td class="px-6 py-4">{{ rider.description }}</td>
          <td class="px-6 py-4">
            <span
              [ngClass]="{
                'bg-green-100 text-green-800 dark:bg-gray-700 dark:text-green-400 border-green-400': rider.status === 'ACTIVE',
                'bg-red-100 text-red-800 dark:bg-gray-700 dark:text-red-400 border-red-400': rider.status === 'INACTIVE',
              }"
              class="text-xs font-medium px-2.5 py-0.5 rounded border"
            >
              {{ rider.status }}
            </span>
          </td>
          <td class="px-6 py-4">
            <button
              (click)="openEditModal(rider)"
              class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300"
            >
              Edit
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Rider Modal -->
<div *ngIf="isEditModalOpen">
  <app-update-riders
    [riderToEdit]="selectedRider"
    (riderUpdated)="onRiderAdded()"
    (closeModal)="closeEditModal()"
  ></app-update-riders>
</div>

<!-- Loading Spinner -->
<ngx-spinner
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="ball-clip-rotate"
  [fullScreen]="true"
>
  <p style="color: white">Loading...</p>
</ngx-spinner>
