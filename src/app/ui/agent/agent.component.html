<div class="p-6">
  <div class="bg-purple-300 dark:bg-gray-800 p-6 rounded-lg shadow-sm mb-6">
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4"
    >
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
          Agent Management
        </h1>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
          Manage and monitor all agents
        </p>
      </div>
      <div class="flex items-center gap-3">
        <app-add-agent (agentAdded)="onAgentUpdated()"></app-add-agent>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex flex-col md:flex-row gap-4 mb-6">
    <div class="flex-1">
      <input
        [formControl]="searchControl"
        type="text"
        class="w-full px-4 py-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-purple-500 focus:border-purple-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
        placeholder="Search agents..."
      />
    </div>
  </div>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
      <thead
        class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
      >
        <tr>
          <th
            *ngFor="
              let header of [
                'Name',
              ]
            "
            scope="col"
            class="px-6 py-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600"
            (click)="sort(header.toLowerCase().replace(' ', ''))"
          >
            <div class="flex items-center">
              {{ header }}
            </div>
          </th>
          <th scope="col" class="px-6 py-3">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let agent of agents"
          class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600"
        >
          <td
            class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
          >
            {{ agent.name }} {{ agent.surname }}
          </td>
          <!-- <td class="px-6 py-4">{{ agent.gender ? agent.gender : '' }}</td> -->
          <!-- <td class="px-6 py-4">{{ agent.nationality }}</td>
          <td class="px-6 py-4">{{ agent.idNumber }}</td>
          <td class="px-6 py-4">{{ agent.dateOfBirth | date }}</td>
          <td class="px-6 py-4">
            <span
              [ngClass]="{
                'bg-green-100 text-green-800 dark:bg-gray-700 dark:text-green-400 border-green-400':
                  agent.status === 'APPROVED',
                'bg-red-100 text-red-800 dark:bg-gray-700 dark:text-red-400 border-red-400':
                  agent.status === 'PENDING',
                'bg-orange-100 text-orange-800 dark:bg-gray-700 dark:text-orange-400 border-orange-400':
                  agent.status === 'AWAITING_APPROVALS',
                'bg-blue-100 text-blue-800 dark:bg-gray-700 dark:text-blue-400 border-blue-400':
                  agent.status === 'ACTIVE'
              }"
              class="text-xs font-medium px-2.5 py-0.5 rounded border"
            >
              {{ agent.status }}
            </span>
          </td> -->
          <td class="px-6 py-4">
            <div class="flex items-center space-x-4">
              <button
                (click)="openEditModal(agent)"
                class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300"
                title="Edit"
              >
                <svg
                  class="w-4 h-4"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"
                  ></path>
                  <path
                    fill-rule="evenodd"
                    d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"
                    clip-rule="evenodd"
                  ></path>
                </svg>
              </button>
              <button
                (click)="deleteAgent(agent.id)"
                class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300"
                title="Delete"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                  />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div *ngIf="isEditModalOpen">
  <app-update-agent
    [agentToEdit]="selectedAgent"
    (agentUpdated)="onAgentUpdated()"
    (closeModal)="closeEditModal()"
  ></app-update-agent>
</div>

<ngx-spinner
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="ball-clip-rotate"
  [fullScreen]="true"
>
  <p style="color: white">Loading...</p>
</ngx-spinner>
