

<div class="p-6 ">
  <div class="bg-purple-300 dark:bg-gray-800 p-6 rounded-lg shadow-sm mb-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Claims Parameters</h1>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Manage and monitor all claim settings</p>
      </div>
      
    </div>
  
  </div>
  
  
  
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
      <div class="mb-4 border-b border-gray-200 dark:border-gray-700">
        <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="default-styled-tab" data-tabs-toggle="#default-styled-tab-content" data-tabs-active-classes="text-purple-600 hover:text-purple-600 dark:text-purple-500 dark:hover:text-purple-500 border-purple-600 dark:border-purple-500" data-tabs-inactive-classes="dark:border-transparent text-gray-500 hover:text-gray-600 dark:text-gray-400 border-gray-100 hover:border-gray-300 dark:border-gray-700 dark:hover:text-gray-300" role="tablist">
            <li class="me-2" role="presentation">
                <button class="inline-block p-4 border-b-2 rounded-t-lg" id="deathType-styled-tab" data-tabs-target="#styled-deathType" type="button" role="tab" aria-controls="deathType" aria-selected="false">Death Type</button>
            </li>
            <li class="me-2" role="presentation">
                <button class="inline-block p-4 border-b-2 rounded-t-lg hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300" id="deathPeriod-styled-tab" data-tabs-target="#styled-deathPeriod" type="button" role="tab" aria-controls="deathPeriod" aria-selected="false">Death Period</button>
            </li>

        </ul>
      </div>
      <div id="default-styled-tab-content">
        <div class="hidden p-4 rounded-lg bg-gray-50 dark:bg-gray-800" id="styled-deathType" role="tabpanel" aria-labelledby="deathType-tab">
            <app-death-type></app-death-type>
        </div>
        <div class="hidden p-4 rounded-lg bg-gray-50 dark:bg-gray-800" id="styled-deathPeriod" role="tabpanel" aria-labelledby="deathPeriod-tab">
            <app-death-period></app-death-period>
        </div>

      </div>
    </div>
  
  </div>
